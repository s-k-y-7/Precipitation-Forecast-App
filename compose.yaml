services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${DB_NAME:-precipitation}
      POSTGRES_USER: ${DB_USER:-precipitation}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-precipitation}
    ports:
      - "127.0.0.1:${DB_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-precipitation} -d ${DB_NAME:-precipitation}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
